spring.application.name=territory-predictive-insights

# Banco H2 persistente
spring.datasource.url=jdbc:h2:file:./territory-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Persistencia JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Aplicacao de console
spring.main.web-application-type=none
spring.main.banner-mode=off

# Codigo de acesso demonstrativo aos limiares
territory.codigo-acesso=${TERRITORY_CODIGO_ACESSO:4321}

# Habilita o menu durante a execucao normal
territory.console.enabled=true
