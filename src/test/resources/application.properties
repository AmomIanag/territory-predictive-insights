spring.application.name=territory-predictive-insights-test

# Banco isolado para testes
spring.datasource.url=jdbc:h2:mem:territory_test_default;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.main.web-application-type=none
spring.main.banner-mode=off

territory.codigo-acesso=4321

# Impede que os testes abram o menu interativo
territory.console.enabled=false
